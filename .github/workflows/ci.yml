name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - inova/homologacao-plano-fstd

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: 2.110.0

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
      - name: Preserve Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase@${{ env.SUPABASE_CLI_VERSION }} start
      - run: npx supabase@${{ env.SUPABASE_CLI_VERSION }} db reset
      - run: npx supabase@${{ env.SUPABASE_CLI_VERSION }} test db
      - run: npx supabase@${{ env.SUPABASE_CLI_VERSION }} db lint --level error
      - name: Verify generated database types
        run: |
          npx supabase@${{ env.SUPABASE_CLI_VERSION }} gen types typescript --local > /tmp/database.types.ts
          npm run check:database-types -- /tmp/database.types.ts src/types/database.types.ts
      - name: Stop local Supabase
        if: always()
        run: npx supabase@${{ env.SUPABASE_CLI_VERSION }} stop --no-backup
